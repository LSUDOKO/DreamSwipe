<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DreamSwipe — Swipe the market. Beat the crowd.</title>
    <meta
      name="description"
      content="Tinder-style PvP prediction duels on Somnia. Swipe YES/NO through live DreamDEX markets, read the crowd, take the pot."
    />

    <!--
      Social share cards.
      URLs are ABSOLUTE on purpose: Facebook, LinkedIn and X refuse to resolve
      root-relative image paths, so a relative og:image renders as a bare link
      with no preview — which is exactly how a shared demo link looks to judges.
      Slack, Discord and iMessage accept either.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dreamswipe.vercel.app/" />
    <meta property="og:title" content="DreamSwipe — Swipe the market. Beat the crowd." />
    <meta
      property="og:description"
      content="Two players. One deck. Swipe YES/NO through live Somnia prediction markets — on-chain escrow pays whoever read the market better."
    />
    <meta
      property="og:image"
      content="https://dreamswipe.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="DreamSwipe — Swipe the market. Beat the crowd."
    />
    <meta
      name="twitter:description"
      content="Two players. One deck. Swipe YES/NO through live Somnia prediction markets — on-chain escrow pays whoever read the market better."
    />
    <meta
      name="twitter:image"
      content="https://dreamswipe.vercel.app/og-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
